name: CI

# Lint/typecheck/test/build run on every push and PR as a validation gate.
# The gh-pages deploy, the nscharrenberg.nl deploy, and the coverage badge
# commit are further scoped to pushes on `main` only, so feature branches
# build but never touch a live site or write back to the repo.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit SHA rather than the
      # mutable `v4` tag — if a tag were ever repointed (this exact supply-
      # chain attack has happened to real projects), a floating tag would
      # execute whatever it now points to. A pinned SHA can't move.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

      - name: Upload coverage summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: ./coverage/coverage-summary.json
          retention-days: 1

      - name: Generate static site
        run: pnpm generate
        env:
          # This repo isn't a `<user>.github.io` repo, so Pages serves it from
          # a subpath (https://<user>.github.io/<repo>/) — bake that into the
          # build. Drop both of these once the real nscharrenberg.nl domain
          # is live (CNAME + DNS + Pages custom domain setting):
          # NUXT_PUBLIC_SITE_URL then falls back to the permanent domain
          # already set in nuxt.config.ts, and every URL that's derived from
          # it (sitemap, robots.txt, canonical, JSON-LD, OG/Twitter images)
          # updates with it — nothing else in the codebase to touch.
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Upload build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ./.output/public
          retention-days: 1

      # A second build, this time without the GitHub Pages subpath env vars,
      # so every URL resolves against the real domain root — this is the one
      # that goes to nscharrenberg.nl, not gh-pages.
      - name: Generate static site for custom domain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm generate

      - name: Upload custom-domain build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-custom-domain
          path: ./.output/public
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job needs write access to push to gh-pages — lint/typecheck/
    # test/build above run with the read-only default from the top of this
    # file, so a compromised or misbehaving dependency invoked during those
    # steps can't push anywhere.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: ./public

      # Publishes straight to the gh-pages branch instead of GitHub's Pages
      # "environment" — the environment route (actions/deploy-pages) kept
      # getting blocked by environment protection rules that weren't
      # controllable from here. This path is a plain branch push, so it has
      # no such gate. Repo Settings → Pages → Source must be set to
      # "Deploy from a branch" → gh-pages → / (root) for this to serve.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

  deploy-host:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No repo permissions needed — this job only talks to the external host
    # over SSH, using the deploy key stored in secrets below.
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-custom-domain
          path: ./public

      - name: Deploy to nscharrenberg.nl over SSH
        uses: easingthemes/ssh-deploy@5d8aeab1a56041e269567e67a08ce00df324a617 # v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_SSH_USER }}
          REMOTE_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          TARGET: ${{ secrets.DEPLOY_SSH_TARGET }}
          SOURCE: ./public/
          # --delete keeps the remote directory in sync with this build,
          # removing files from old builds (eg. stale hashed JS/CSS chunks).
          # Only safe because DEPLOY_SSH_TARGET must point at a directory
          # dedicated to this site — never a shared/multi-site webroot.
          ARGS: "-rlgoDzvc -i --delete"

  coverage-badge:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job needs write access to commit the badge — same rationale
    # as `deploy` above. Commits made with the default GITHUB_TOKEN don't
    # trigger a new workflow run, so this can't loop back into itself.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-summary
          path: ./coverage

      - run: node scripts/update-coverage-badge.mjs

      - name: Commit the badge if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Coverage badge unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update coverage badge"
          git push
